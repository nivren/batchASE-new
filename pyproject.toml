[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batchase"
version = "0.7.0"
description = "Batched ASE relaxation engine for high-throughput crystal structure prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ICT-CSP Team" }
]
dependencies = [
    "torch>=2.0.0",
    "ase>=3.22.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
mace = [
    "mace-torch>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
batchase = ["py.typed"]
